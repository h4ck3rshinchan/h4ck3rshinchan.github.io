<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,190,200,.45), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(190,220,255,.45), transparent 30%),
        #f8f4f2;
}

/* BACKGROUND PARTICLES */

#particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.particle {
    position: absolute;
    border-radius: 50%;
    animation: float linear infinite;
    opacity: .5;
}

@keyframes float {
    from {
        transform: translateY(110vh) rotate(0deg);
    }

    to {
        transform: translateY(-10vh) rotate(360deg);
    }
}

/* MAIN CARD */

.card {
    width: min(90vw, 650px);
    min-height: 620px;
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border-radius: 32px;
    padding: 55px 35px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,.08);
    position: relative;
    z-index: 2;
}

/* CAT */

.cat {
    position: relative;
    width: 165px;
    height: 120px;
    margin: 10px auto 45px;
}

.head {
    width: 150px;
    height: 115px;
    background: #f6a04d;
    border-radius: 48%;
    position: absolute;
    left: 8px;
    top: 15px;
}

.ear {
    width: 48px;
    height: 48px;
    background: #f6a04d;
    position: absolute;
    top: 0;
}

.ear.left {
    left: 10px;
    clip-path: polygon(0 0, 100% 35%, 15% 100%);
}

.ear.right {
    right: 8px;
    clip-path: polygon(100% 0, 0 35%, 85% 100%);
}

.eye {
    width: 14px;
    height: 18px;
    background: #252525;
    border-radius: 50%;
    position: absolute;
    top: 58px;
    z-index: 2;
}

.eye.left {
    left: 52px;
}

.eye.right {
    right: 48px;
}

.mouth {
    width: 13px;
    height: 13px;
    background: #ff5c89;
    border-radius: 50%;
    position: absolute;
    left: 69px;
    top: 77px;
    z-index: 2;
}

.heart {
    position: absolute;
    right: -5px;
    top: -8px;
    font-size: 70px;
    color: #ef476f;
    transform: rotate(-15deg);
    animation: heartbeat 1.2s infinite;
    z-index: 5;
}

@keyframes heartbeat {
    0%, 100% {
        transform: rotate(-15deg) scale(1);
    }

    50% {
        transform: rotate(-15deg) scale(1.12);
    }
}

/* QUESTION */

h1 {
    color: #282828;
    font-size: clamp(32px, 6vw, 48px);
    line-height: 1.15;
    margin-bottom: 45px;
}

/* BUTTONS */

.buttons {
    min-height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
}

button {
    border: none;
    font-family: inherit;
    font-size: 22px;
    font-weight: bold;
    padding: 20px 55px;
    border-radius: 16px;
    cursor: pointer;
    transition: transform .2s;
}

button:hover {
    transform: scale(1.04);
}

button:active {
    transform: scale(.97);
}

#yesBtn {
    background: linear-gradient(135deg, #e93567, #bd123f);
    color: white;
    box-shadow: 0 8px 20px rgba(210,25,75,.25);
}

#noBtn {
    background: transparent;
    color: #252525;
    position: relative;
}

.hint {
    margin-top: 22px;
    color: #8b5c67;
    font-size: 18px;
    font-style: italic;
    min-height: 25px;
}

/* SUCCESS PAGE */

.success {
    display: none;
    animation: appear .5s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.96);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.success h1 {
    color: #d82055;
    margin-bottom: 15px;
}

.success p {
    font-size: 24px;
    color: #444;
    margin-bottom: 20px;
}

/* GIF / STICKER AREA */

.gif-box {
    width: 100%;
    max-width: 420px;
    height: 320px;
    margin: auto;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.love-gif {
    display: none;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
}

.love-gif.active {
    display: block;
    animation: gifAppear .5s ease;
}

@keyframes gifAppear {
    from {
        opacity: 0;
        transform: scale(.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.gif-counter {
    margin-top: 15px;
    color: #8b5c67 !important;
    font-size: 16px !important;
}

/* CONFETTI */

.confetti {
    position: fixed;
    top: -40px;
    z-index: 9999;
    pointer-events: none;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(115vh) rotate(720deg);
    }
}

/* MOBILE */

@media (max-width: 550px) {

    .card {
        width: 92vw;
        min-height: 560px;
        padding: 40px 20px;
    }

    .cat {
        margin-bottom: 30px;
    }

    button {
        padding: 17px 32px;
        font-size: 19px;
    }

    h1 {
        margin-bottom: 35px;
    }

    .gif-box {
        height: 280px;
    }

    .success p {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div id="particles"></div>

<div class="card">

    <!-- QUESTION PAGE -->

    <div id="questionPage">

        <div class="cat">
            <div class="heart">♥</div>

            <div class="ear left"></div>
            <div class="ear right"></div>

            <div class="head"></div>

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="mouth"></div>
        </div>

        <h1>Hey you! will you be my girlfriend?</h1>

        <div class="buttons">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>

        <div class="hint" id="hint">
            No seems a bit shy
        </div>

    </div>


    <!-- SUCCESS PAGE -->

    <div class="success" id="successPage">

        <h1>Yayy! You said YES!</h1>

        <p>Knew you'd say yes</p>

        <div class="gif-box">

            <!-- URLs ARE INSERTED AUTOMATICALLY BY JAVASCRIPT -->

            <img class="love-gif active" id="loveGif" alt="Love sticker">

        </div>

        <div class="gif-counter" id="gifCounter">
            1 / 6
        </div>

    </div>

</div>


<script>

/* ================================
   YOUR DIRECT MEDIA URLs
   Replace these 6 URLs with GIF
   or animated sticker media URLs.
================================ */

const gifSequence = [

    // Peach & Goma
    "https://media.giphy.com/media/bEgopybtrZgHjSLPbx/giphy.gif",
    
   
    // Milk & Mocha Bear
    "https://media.giphy.com/media/kfRKF0iqA8jyDqq1nH/giphy.gif",

 
"https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif",
 
 
];


/* ================================
   ELEMENTS
================================ */

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const hint = document.getElementById("hint");

const questionPage = document.getElementById("questionPage");
const successPage = document.getElementById("successPage");

const loveGif = document.getElementById("loveGif");
const gifCounter = document.getElementById("gifCounter");


/* ================================
   GIF SEQUENCE
================================ */

let currentGif = 0;
let gifTimer = null;

function showGif(index) {

    loveGif.classList.remove("active");

    loveGif.onload = function() {

        loveGif.classList.add("active");

    };

    loveGif.src = gifSequence[index];

    gifCounter.textContent =
        (index + 1) + " / " + gifSequence.length;
}


function startGifSequence() {

    if (gifTimer !== null) {
        clearInterval(gifTimer);
    }

    currentGif = 0;

    showGif(currentGif);

    gifTimer = setInterval(function() {

        currentGif++;

        if (currentGif >= gifSequence.length) {
            currentGif = 0;
        }

        showGif(currentGif);

    }, 4000);
}


/* ================================
   GIF ERROR HANDLER
================================ */

loveGif.addEventListener("error", function() {

    /*
      If one URL is wrong, skip it
      instead of leaving a blank screen.
    */

    currentGif++;

    if (currentGif >= gifSequence.length) {
        currentGif = 0;
    }

    setTimeout(function() {
        showGif(currentGif);
    }, 300);

});


/* ================================
   RUNNING NO BUTTON
================================ */

let noClicks = 0;

const messages = [
    "No seems a bit shy",
    "Hey, where are you going?",
    "You can't escape that easily",
    "Just press Yes already",
    "Wrong button",
    "Okay, I give up... NO I DON'T"
];


function moveNoButton() {

    noClicks++;

    hint.textContent =
        messages[
            Math.min(
                noClicks,
                messages.length - 1
            )
        ];


    const maxX =
        Math.max(
            10,
            window.innerWidth -
            noBtn.offsetWidth -
            20
        );


    const maxY =
        Math.max(
            10,
            window.innerHeight -
            noBtn.offsetHeight -
            20
        );


    const randomX =
        10 + Math.random() * (maxX - 10);


    const randomY =
        10 + Math.random() * (maxY - 10);


    noBtn.style.position = "fixed";

    noBtn.style.left =
        randomX + "px";

    noBtn.style.top =
        randomY + "px";

    noBtn.style.zIndex = "1000";
}


noBtn.addEventListener(
    "mouseenter",
    moveNoButton
);


noBtn.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveNoButton();

    },
    { passive: false }
);


/* ================================
   YES BUTTON
================================ */

yesBtn.addEventListener(
    "click",
    function() {

        questionPage.style.display = "none";

        successPage.style.display = "block";

        startGifSequence();

        createConfetti();

    }
);


/* ================================
   CONFETTI
================================ */

function createConfetti() {

    const symbols = [
        "♥",
        "♡",
        "✦",
        "💕",
        "💗",
        "✨"
    ];


    for (let i = 0; i < 70; i++) {

        const item =
            document.createElement("div");

        item.className = "confetti";


        item.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];


        item.style.left =
            Math.random() * 100 + "vw";


        item.style.fontSize =
            (Math.random() * 20 + 15) + "px";


        item.style.animationDuration =
            (Math.random() * 3 + 2) + "s";


        item.style.animationDelay =
            (Math.random() * .5) + "s";


        document.body.appendChild(item);


        setTimeout(function() {

            item.remove();

        }, 6000);
    }
}


/* ================================
   BACKGROUND PARTICLES
================================ */

const particles =
    document.getElementById("particles");


for (let i = 0; i < 25; i++) {

    const particle =
        document.createElement("div");

    particle.className = "particle";


    const size =
        Math.random() * 10 + 4;


    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";


    particle.style.left =
        Math.random() * 100 + "vw";


    particle.style.animationDuration =
        (Math.random() * 10 + 8) + "s";


    particle.style.animationDelay =
        (Math.random() * -10) + "s";


    particle.style.background =
        Math.random() > 0.5
            ? "#ffb6c8"
            : "#b9e6ff";


    particles.appendChild(particle);
}

</script>

</body>
</html>
